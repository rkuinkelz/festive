<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>बस आरक्षण प्रणाली — सशस्त्र प्रहरी बल, नेपाल</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#eef1f6; --surface:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --brand:#0d2b4a; --brand2:#1b5289; --accent:#e8a33d;
  --ok:#0f9d58; --danger:#d64545; --warn:#d97706;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,24,40,.06), 0 8px 24px -12px rgba(16,24,40,.25);
}
html,body{height:100%}
body{
  font-family:'Mukta','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
  font-size:15px; line-height:1.5;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}

/* TOPBAR */
.topbar{
  background:linear-gradient(120deg,#08203a,#0d2b4a 45%,#1b5289);
  color:#fff; padding:16px 20px;
  display:flex; flex-wrap:wrap; gap:18px; align-items:center; justify-content:space-between;
  box-shadow:0 10px 30px -14px rgba(8,32,58,.9);
}
.brand{display:flex;align-items:center;gap:14px;min-width:260px}
.logo{
  width:52px;height:52px;border-radius:14px;flex:0 0 auto;
  background:linear-gradient(160deg,#e8a33d,#c47f1a);
  display:grid;place-items:center;font-weight:700;font-size:15px;color:#0d2b4a;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);
}
.brand h1{font-size:18px;font-weight:600;letter-spacing:.2px}
.brand p{font-size:12.5px;color:#a9c4e0}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{
  background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.16);
  border-radius:12px; padding:7px 14px; min-width:96px; text-align:center;
  backdrop-filter:blur(4px);
}
.stat b{display:block;font-size:19px;font-weight:600;line-height:1.2}
.stat span{font-size:11.5px;color:#b9d0e8}
.conn-status{
  display:inline-block;width:8px;height:8px;border-radius:50%;
  background:#10b981;margin-right:6px;vertical-align:middle;
}
.conn-status.offline{background:#ef4444}

/* TABS */
.tabs{
  background:var(--surface); border-bottom:1px solid var(--line);
  display:flex; gap:4px; padding:0 16px; overflow-x:auto;
  position:sticky; top:0; z-index:40; box-shadow:0 2px 10px -8px rgba(0,0,0,.3);
}
.tab{
  background:none;border:none;cursor:pointer;padding:14px 16px;
  font-weight:500;color:var(--muted);white-space:nowrap;
  border-bottom:3px solid transparent;transition:.15s;
}
.tab:hover{color:var(--brand2);background:#f8fafc}
.tab.active{color:var(--brand);border-bottom-color:var(--accent);font-weight:600}

/* LAYOUT */
main{padding:20px;max-width:1320px;margin:0 auto}
.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px;
}
.panel-head{
  padding:14px 18px;border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
  background:linear-gradient(180deg,#fbfcfe,#f5f7fb);
}
.panel-head h2{font-size:16px;font-weight:600;color:var(--brand)}
.panel-head h2 small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.panel-body{padding:18px}

/* TABLES */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
thead th{
  background:#f1f5f9;text-align:left;padding:10px 12px;font-weight:600;
  color:#334155;font-size:13px;border-bottom:1px solid var(--line);white-space:nowrap;
}
tbody td{padding:10px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tbody tr:hover{background:#f8fafc}
tbody tr:last-child td{border-bottom:none}
.num{width:44px;color:var(--muted);font-variant-numeric:tabular-nums}

.badge{
  display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;
  background:#e0e7ff;color:#3730a3;white-space:nowrap;
}
.badge.f-dashain{background:#ffe8d6;color:#9a3412}
.badge.f-tihar{background:#ede9fe;color:#5b21b6}
.badge.ok{background:#d1fae5;color:#065f46}
.badge.warn{background:#fef3c7;color:#92400e}
.badge.danger{background:#fee2e2;color:#991b1b}
.badge.badge-apf{background:#dbeafe;color:#1e40af}
.badge.badge-ex{background:#d1fae5;color:#065f46}
.badge.badge-family{background:#fed7aa;color:#9a3412}
.badge.route-badge{
  background:#fef9c3;color:#854d0e;border:1px solid #fde047;
  font-weight:600;font-size:12.5px;
}

/* BUTTONS */
.btn{
  border:1px solid var(--line);background:#fff;color:var(--ink);
  padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500;
  transition:.15s;display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{background:#f8fafc;border-color:#cbd5e1}
.btn.primary{background:var(--brand2);border-color:var(--brand2);color:#fff}
.btn.primary:hover{background:#164570}
.btn.danger{color:var(--danger);border-color:#fecaca;background:#fff5f5}
.btn.danger:hover{background:#fee2e2}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* FORM */
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:600;color:#475569;margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:9px;
  background:#fff;outline:none;transition:.15s;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--brand2);box-shadow:0 0 0 3px rgba(27,82,137,.12);
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}

.type-radio{display:flex;gap:8px;flex-wrap:wrap}
.radio-chip{
  border:1.6px solid #cbd5e1;background:#fff;border-radius:10px;
  padding:7px 12px;cursor:pointer;font-weight:500;font-size:13px;
  display:flex;align-items:center;gap:6px;transition:.15s;
}
.radio-chip input{margin:0;accent-color:var(--brand2)}
.radio-chip:hover{border-color:#94a3b8}
.radio-chip.active{border-color:var(--brand2);background:#eff6ff;color:var(--brand2);font-weight:600}

/* BOOKING LAYOUT */
.booking-grid{display:grid;grid-template-columns:400px 1fr;gap:20px;align-items:start}
@media(max-width:960px){.booking-grid{grid-template-columns:1fr}}

/* BUS */
.bus{
  background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:14px;
  max-width:380px;margin:0 auto;
}
.bus-cabin{
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
  padding:10px;background:linear-gradient(180deg,#e2e8f0,#cbd5e1);
  border-radius:10px;margin-bottom:14px;
  border-bottom:2px dashed #94a3b8;
}
.cabin-seat{
  background:#64748b;color:#fff;border-radius:7px;
  padding:9px 4px;text-align:center;font-size:11.5px;font-weight:600;line-height:1.25;
}
.cabin-seat.driver{background:#1e293b}
.cabin-seat.standby{background:#7c8798}

.side-headers{
  display:grid;grid-template-columns:1fr 1fr 22px 1fr 1fr;
  gap:8px;margin-bottom:6px;
  font-size:11px;font-weight:700;color:#475569;
  text-align:center;letter-spacing:.4px;
}
.side-headers .label-a{grid-column:1/3}
.side-headers .label-b{grid-column:4/6}

.seat-row{
  display:grid;grid-template-columns:1fr 1fr 22px 1fr 1fr;
  gap:8px;margin-bottom:8px;
}
.seat-row.back{grid-template-columns:repeat(5,1fr);margin-top:4px;}
.aisle{display:flex;align-items:center;justify-content:center}
.door-icon{font-size:15px;line-height:1;filter:grayscale(.3)}

.seat{
  aspect-ratio:1/1;border-radius:10px;border:1.6px solid #cbd5e1;background:#fff;
  font-size:12.5px;font-weight:600;color:#334155;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:.12s;padding:0;position:relative;
}
.seat:hover:not(.booked):not(.selected){
  border-color:var(--brand2);background:#eff6ff;transform:translateY(-2px);
}
.seat.booked{cursor:pointer}
.seat.booked.type-apf{background:#dbeafe;border-color:#93c5fd;color:#1e40af}
.seat.booked.type-ex{background:#d1fae5;border-color:#6ee7b7;color:#065f46}
.seat.booked.type-family{background:#fed7aa;border-color:#fdba74;color:#9a3412}
.seat.booked:hover{filter:brightness(.95)}
.seat.selected{background:var(--brand2)!important;border-color:var(--brand2)!important;
  color:#fff!important;box-shadow:0 0 0 3px rgba(27,82,137,.25);transform:none}

.seat-tag{
  position:absolute;bottom:-1px;right:-1px;
  background:#0f172a;color:#fff;font-size:8.5px;font-weight:700;
  padding:0px 3px;border-radius:5px;line-height:1.3;
  max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  letter-spacing:0;
}

.back-label{
  text-align:center;font-size:11px;color:var(--muted);
  margin:12px 0 6px;font-weight:600;letter-spacing:.4px;
}

.legend{display:flex;gap:12px;justify-content:center;margin-top:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{width:13px;height:13px;border-radius:4px;display:inline-block;margin-right:5px;vertical-align:-2px;border:1.5px solid #cbd5e1}
.legend .lg-empty{background:#fff}
.legend .lg-apf{background:#dbeafe;border-color:#93c5fd}
.legend .lg-ex{background:#d1fae5;border-color:#6ee7b7}
.legend .lg-family{background:#fed7aa;border-color:#fdba74}
.legend .lg-sel{background:#1b5289;border-color:#1b5289}
.legend .lg-cabin{background:#64748b;border-color:#64748b}

.place-groups{
  margin-top:16px;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:12px;
}
.place-groups h4{
  font-size:13px;font-weight:700;color:var(--brand);
  margin-bottom:10px;display:flex;align-items:center;gap:6px;
}
.place-groups h4 .mode{
  font-weight:500;font-size:11.5px;color:var(--muted);
  background:#f1f5f9;padding:1px 8px;border-radius:99px;
}
.place-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:7px 10px;border-radius:8px;margin-bottom:5px;
  background:#f8fafc;border:1px solid #eef2f7;
  font-size:13px;
}
.place-item:last-child{margin-bottom:0}
.place-item .place-name{font-weight:500;color:#334155;display:flex;align-items:center;gap:6px}
.place-item .place-dot{
  width:8px;height:8px;border-radius:50%;background:var(--brand2);flex:0 0 auto;
}
.place-item .place-count{
  background:var(--brand2);color:#fff;font-size:11.5px;font-weight:700;
  padding:1px 9px;border-radius:99px;
}
.place-item .place-seats{
  font-size:11px;color:var(--muted);margin-left:8px;
  font-family:ui-monospace,Menlo,monospace;
}

/* MISC */
.empty{padding:38px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:8px;opacity:.5}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{
  padding:8px 12px;border:1px solid #cbd5e1;border-radius:10px;min-width:220px;outline:none;
}
.toolbar input[type=search]:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(27,82,137,.12)}
select.trip-select{
  padding:9px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;
  min-width:280px;max-width:100%;outline:none;font-weight:500;
}
.note{
  background:#fffbeb;border:1px solid #fde68a;color:#78350f;
  padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;
}
.note.danger{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.note.info{background:#eff6ff;border-color:#bfdbfe;color:#1e40af}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120%);
  background:#0f172a;color:#fff;padding:11px 20px;border-radius:12px;
  box-shadow:0 14px 34px -10px rgba(0,0,0,.55);z-index:999;transition:.3s;font-size:14px;
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{background:#991b1b}
.toast.ok{background:#065f46}

.id-tag{
  display:inline-block;background:#f1f5f9;color:#334155;
  padding:1px 7px;border-radius:6px;font-size:11.5px;
  font-family:ui-monospace,Menlo,Consolas,monospace;
  font-weight:600;letter-spacing:.3px;
}
.place-big{
  display:inline-block;background:#fef9c3;color:#854d0e;
  border:1px solid #fde047;padding:3px 12px;border-radius:8px;
  font-weight:600;font-size:14px;
}

.trip-detail{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:8px;font-size:13px;
}
.trip-detail .td-item{
  background:#f8fafc;border:1px solid #eef2f7;
  padding:8px 11px;border-radius:8px;
}
.trip-detail .td-item .lbl{
  display:block;font-size:11px;color:var(--muted);font-weight:600;
  text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px;
}
.trip-detail .td-item .val{font-weight:600;color:#1e293b;font-size:13.5px}

/* Loading overlay */
#loadingOverlay{
  position:fixed;inset:0;background:rgba(15,23,42,.85);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:9999;color:#fff;gap:16px;
}
#loadingOverlay.hidden{display:none}
.spinner{
  width:44px;height:44px;border:4px solid rgba(255,255,255,.2);
  border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* PRINT */
#printRoot{display:none}
@media print{
  body{background:#fff}
  body>*{display:none !important}
  #printRoot{display:block !important;padding:0;font-size:12px}
  #printRoot h1{font-size:16px;text-align:center;margin-bottom:2px}
  #printRoot h2{font-size:13px;text-align:center;font-weight:400;margin-bottom:14px;color:#333}
  #printRoot table{width:100%;border-collapse:collapse;font-size:10px}
  #printRoot th,#printRoot td{border:1px solid #999;padding:4px 5px;text-align:left}
  #printRoot th{background:#eee}
  #printRoot .meta{margin:10px 0;font-size:12px}
  #printRoot .sign{margin-top:36px;display:flex;justify-content:space-between;font-size:11px}
}
</style>
</head>
<body>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <div>डाटा लोड गर्दै...</div>
</div>

<header class="topbar">
  <div class="brand">
    <div class="logo">सप्र</div>
    <div>
      <h1>बस आरक्षण तथा व्यवस्थापन प्रणाली</h1>

  <div class="stats" id="stats"></div>

<nav class="tabs" id="tabs">

  <button class="tab" data-tab="coordination">☎️ समन्वय अधिकृत</button>
</nav>

<main id="view"></main>

<div id="printRoot"></div>
<div class="toast" id="toast"></div>

/* Convert DB row → booking object */
function rowToBooking(row) {
  return {
    seat: row.seat,
    type: row.type,
    name: row.name,
    rank: row.rank,
    idNo: row.id_no,
    unit: row.unit,
    phone: row.phone,
    quota: row.quota,
    gender: row.gender,
    age: row.age,
    note: row.note,
    headSeat: row.head_seat,
    relation: row.relation,
    at: row.created_at,
    dbId: row.id
  };
}

/* Fetch all bookings → cache */
async function fetchAllBookings() {
  const { data, error } = await sb.from('bookings').select('*');
  if (error) {
    console.error('Fetch error:', error);
    setConnectionStatus(false);
    toast('डाटा लोड गर्न सकिएन: ' + error.message, 'err');
    return false;
  }
  setConnectionStatus(true);
  BOOKINGS_CACHE = {};
  data.forEach(row => {
    if (!BOOKINGS_CACHE[row.trip_id]) BOOKINGS_CACHE[row.trip_id] = {};
    BOOKINGS_CACHE[row.trip_id][row.seat] = rowToBooking(row);
  });
  return true;
}

/* Insert booking */
async function insertBooking(tripId, b) {
  const { error } = await sb.from('bookings').insert([{
    trip_id: tripId,
    seat: b.seat,
    type: b.type,
    name: b.name,
    rank: b.rank || null,
    id_no: b.idNo || null,
    unit: b.unit || null,
    phone: b.phone || null,
    quota: b.quota,
    gender: b.gender || null,
    age: b.age || null,
    note: b.note || null,
    head_seat: b.headSeat || null,
    relation: b.relation || null
  }]);

  if (error) {
    console.error('Insert error:', error);
    if (error.code === '23505') {
      toast('यो सिट भर्खरै अरूले आरक्षण गरिसके। पुनः प्रयास गर्नुहोस्।', 'err');
    } else if (error.code === '23514') {
      toast('डाटा ढाँचा मिलेन।', 'err');
    } else {
      toast('सेभ गर्न सकिएन: ' + error.message, 'err');
    }
    return false;
  }
  return true;
}

/* Delete by seats */
async function deleteBookings(tripId, seats) {
  if (!seats.length) return true;
  const { error } = await sb.from('bookings')
    .delete()
    .eq('trip_id', tripId)
    .in('seat', seats);

  if (error) {
    console.error('Delete error:', error);
    toast('मेटाउन सकिएन: ' + error.message, 'err');
    return false;
  }
  return true;
}

/* Realtime subscription */
function setupRealtime() {
  if (REALTIME_CHANNEL) sb.removeChannel(REALTIME_CHANNEL);

  REALTIME_CHANNEL = sb
    .channel('bookings-realtime')
    .on(
      'postgres_changes',
      { event: '*', schema: 'public', table: 'bookings' },
      async () => {
        // Simple approach: re-fetch everything
        const ok = await fetchAllBookings();
        if (ok) render();
      }
    )
    .subscribe(status => {
      setConnectionStatus(status === 'SUBSCRIBED');
    });
}

function renderStats() {
  const totalSeats = TRIPS.length * TOTAL_SEATS;
  let apf = 0, ex = 0, family = 0;
  TRIPS.forEach(t => Object.values(tripBookings(t.id)).forEach(p => {
    if (p.type === 'apf') apf++;
    else if (p.type === 'ex') ex++;
    else if (p.type === 'family') family++;
  }));
  const booked = apf + ex + family;
  const pct = totalSeats ? Math.round(booked / totalSeats * 100) : 0;

  $('#stats').innerHTML = `
    <div class="stat"><b>${TRIPS.length}</b><span>कुल यात्रा</span></div>
    <div class="stat"><b>${apf}</b><span>सप्र कर्मचारी</span></div>
    <div class="stat"><b>${ex}</b><span>भूतपूर्व</span></div>
    <div class="stat"><b>${family}</b><span>परिवार</span></div>
    <div class="stat"><b>${pct}%</b><span>अकुपेन्सी</span></div>`;
}

function seatBtn(num, bookings, trip) {
  const p = bookings[num];
  const sel = state.selectedSeat === num;
  const cls = ['seat'];
  if (p) {
    cls.push('booked');
    cls.push(PASSENGER_TYPES[p.type]?.seatCls || 'type-apf');
  }
  if (sel) cls.push('selected');

  const label = seatLabel(num);
  const mode = placeModeLabel(trip);

  let title = `सिट ${label} — खाली`;
  let tag = '';
  if (p) {
    const q = quotaOf(trip.route, p.quota);
    const placeName = q ? q.label : '—';

    if (p.type === 'family') {
      const head = bookings[p.headSeat];
      title = `सिट ${label} — ${p.name} (${p.relation})\n` +
              `प्रमुख: ${head ? head.name : '—'} · सिट ${seatLabel(p.headSeat)}\n` +
              `${mode}: ${placeName}`;
    } else {
      title = `सिट ${label} — ${p.name} (${p.rank || '—'}${p.idNo ? ' / ID ' + p.idNo : ''})\n` +
              `${mode}: ${placeName}`;
    }
    tag = shortPlaceLabel(placeName);
  }

  return `<button class="${cls.join(' ')}" data-seat="${num}" title="${esc(title)}">
    ${label}
    ${tag ? `<span class="seat-tag">${esc(tag)}</span>` : ''}
  </button>`;
}

function renderBusMap(bookings, trip) {

  });

  html += `
    <div class="side-headers">
      <span class="label-a">साईड A</span>
      <span class="label-b">साईड B</span>
    </div>`;

  SEAT_LAYOUT.rows.forEach(row => {
    html += '<div class="seat-row">';
    row.a.forEach(n => { html += seatBtn(n, bookings, trip); });
    html += `<div class="aisle">${row.door ? '<span class="door-icon" title="ढोका">🚪</span>' : ''}</div>`;
    row.b.forEach(n => { html += seatBtn(n, bookings, trip); });

  html += '<div class="back-label">पछाडिको लाइन — क · ख · ग · घ · ङ</div>';

function renderPlaceGroups(trip, bookings) {
  const mode = trip.route.mode;
  const modeText = mode === 'pickup' ? 'आरोहण स्थान (चढ्ने)' : 'गन्तव्य (झर्ने)';

  const groups = {};
  trip.route.quotas.forEach(q => {
    groups[q.key] = { label: q.label, seats: [], total: q.seats };
  });
  Object.values(bookings).forEach(p => {
    if (groups[p.quota]) groups[p.quota].seats.push(p.seat);
  });

  const items = Object.values(groups).map(g => {
    const count = g.seats.length;
    const seatList = g.seats.sort((a, b) => a - b).map(seatLabel).join(', ');
    const empty = count === 0;
    return `<div class="place-item">
      <span class="place-name">
        <span class="place-dot" style="background:${empty ? '#cbd5e1' : '#1b5289'}"></span>
        ${esc(g.label)}
        ${seatList ? `<span class="place-seats">${esc(seatList)}</span>` : ''}
      </span>

  return newBookingForm(trip, seat);
}

function familyFormFields(trip, seat, label, typeRadio) {
  const b = tripBookings(trip.id);
  const heads = headsOf(trip);
  const pt = PASSENGER_TYPES.family;

  const headBlock = `
    <div class="panel-head">
      <h2>सिट ${label} — परिवारको सदस्य <small>प्रमुख कर्मचारीसँग जोडिन्छ</small></h2>
      <span class="badge ${pt.cls}">${pt.label}</span>
    </div>`;

  if (!heads.length) {
    return `${headBlock}
      <div class="panel-body">
        <form id="bookingForm" autocomplete="off">
          <input type="hidden" id="fSeat" value="${seat}">
          ${typeRadio}
          <div class="note danger">
            ⚠️ यो यात्रामा अझै कुनै <b>सशस्त्र प्रहरी कर्मचारी</b> वा
            <b>भूतपूर्व कर्मचारी</b>को आरक्षण गरिएको छैन।<br>
            परिवारको सदस्यको सिट कर्मचारीसँग जोडिनुपर्ने हुनाले पहिले कर्मचारीको सिट आरक्षण गर्नुहोस्।
          </div>

      </div>`;
  }

  const headOpts = ['<option value="">— प्रमुख कर्मचारी छान्नुहोस् —</option>'].concat(
    heads.map(h => {
      const fc = familyCountOf(trip, h.seat);
      const left = MAX_FAMILY_PER_HEAD - fc;

        सिट ${seatLabel(h.seat)} — ${esc(h.name)} (${ptH.short}${h.rank ? ' / ' + h.rank : ''}${idPart})${esc(place)} — परिवार ${fc}/${MAX_FAMILY_PER_HEAD}${left <= 0 ? ' — भरिएको' : ''}

  const relOpts = RELATIONS.map(r => `<option value="${r}">${esc(r)}</option>`).join('');

  return `${headBlock}
    <div class="panel-body">
      <form id="bookingForm" autocomplete="off">
        <input type="hidden" id="fSeat" value="${seat}">
        ${typeRadio}

        <div class="field">
          <label>प्रमुख कर्मचारी छान्नुहोस् *</label>
          <select id="fHead" required>${headOpts}</select>
          <div class="hint">परिवारको सदस्यले प्रमुख कर्मचारीको <b>${trip.route.mode === 'pickup' ? 'आरोहण' : 'गन्तव्य'} स्थान</b> नै पाउँछन्।</div>
        </div>

        <div class="field">
          <label>सम्बन्ध *</label>
          <select id="fRelation" required>
            <option value="">— सम्बन्ध छान्नुहोस् —</option>
            ${relOpts}
          </select>
        </div>

        <div class="field">
          <label>परिवारको सदस्यको नाम थर *</label>
          <input type="text" id="fName" required placeholder="जस्तै: सीता थापा">
        </div>

        <div class="grid2">
          <div class="field">
            <label>लिङ्ग</label>
            <select id="fGender">
              <option value="पुरुष">पुरुष</option>
              <option value="महिला">महिला</option>
              <option value="अन्य">अन्य</option>
            </select>
          </div>
          <div class="field">
            <label>उमेर</label>
            <input type="number" id="fAge" min="1" max="120">
          </div>
        </div>

        <div class="field">
          <label>कैफियत</label>
          <input type="text" id="fNote" placeholder="वैकल्पिक">
        </div>

        <div style="display:flex;gap:10px;margin-top:6px">
          <button type="submit" class="btn primary">✔ आरक्षण पुष्टि गर्ने</button>
          <button type="button" class="btn" id="closeSeat">रद्द</button>
        </div>
      </form>
    </div>`;
}

/* ---------- BINDING ---------- */

function bindBooking() {
  const trip = getTrip(state.activeTrip);

  const sel = $('#tripSelect');
  if (sel) sel.addEventListener('change', e => {
    state.activeTrip = e.target.value;
    state.selectedSeat = null;
    state.newBookingType = 'apf';
    render();
  });

  $$('[data-seat]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.selectedSeat = Number(btn.dataset.seat);
      state.newBookingType = 'apf';
      render();
    });
  });

  const close = $('#closeSeat');
  if (close) close.addEventListener('click', () => { state.selectedSeat = null; render(); });

  const cancel = $('#cancelBooking');
  if (cancel) cancel.addEventListener('click', async () => {
    const seat = state.selectedSeat;
    const b = tripBookings(trip.id);
    const p = b[seat];
    if (!p) return;

    const family = p.type !== 'family' ? familyMembersOf(trip, seat) : [];

    let msg = `सिट ${seatLabel(seat)} (${p.name}) को आरक्षण रद्द गर्ने?`;
    if (family.length) {
      msg += `\n\n⚠️ यससँग जोडिएका ${family.length} जना परिवारको सदस्य पनि रद्द हुनेछन्:\n` +
        family.map(f => `• सिट ${seatLabel(f.seat)} — ${f.name} (${f.relation})`).join('\n');
    }
    if (!confirm(msg)) return;

    const seatsToDelete = [seat, ...family.map(f => f.seat)];
    const ok = await deleteBookings(trip.id, seatsToDelete);
    if (!ok) return;

    state.selectedSeat = null;
    toast(family.length
      ? `आरक्षण र ${family.length} परिवारको सदस्य रद्द गरियो।`
      : 'आरक्षण रद्द गरियो।', 'ok');

    await fetchAllBookings();
    render();
  });

  $$('input[name="fType"]').forEach(r => {
    r.addEventListener('change', e => {
      state.newBookingType = e.target.value;
      render();
    });
  });

  const form = $('#bookingForm');
  if (form) form.addEventListener('submit', e => {
    e.preventDefault();
    submitBooking(trip);
  });
}

/* ---------- SUBMIT ---------- */

async function submitBooking(trip) {
  const seat = Number($('#fSeat').value);
  const typeEl = document.querySelector('input[name="fType"]:checked');
  if (!typeEl) return toast('यात्रुको प्रकार छान्नुहोस्।', 'err');
  const type = typeEl.value;

  const name = $('#fName').value.trim();
  if (!name) return toast('नाम थर अनिवार्य छ।', 'err');

  const b = tripBookings(trip.id);
  if (b[seat]) return toast('यो सिट पहिले नै आरक्षित छ।', 'err');

  let bookingData;

  if (type === 'family') {
    const headSeat = Number($('#fHead').value);
    const relation = $('#fRelation').value;

    if (!headSeat) return toast('प्रमुख कर्मचारी छान्नुहोस्।', 'err');
    if (!relation) return toast('सम्बन्ध अनिवार्य छ।', 'err');

    const head = b[headSeat];
    if (!head) return toast('प्रमुख कर्मचारी भेटिएन।', 'err');
    if (head.type === 'family') return toast('प्रमुख कर्मचारी मान्य छैन।', 'err');

    const fc = familyCountOf(trip, headSeat);
    if (fc >= MAX_FAMILY_PER_HEAD) {
      return toast(`यो कर्मचारीको ${MAX_FAMILY_PER_HEAD} जना परिवारको सीमा भरिएको छ।`, 'err');
    }

    const q = quotaOf(trip.route, head.quota);
    const usedInQuota = Object.values(b).filter(p => p.quota === head.quota).length;
    if (usedInQuota >= q.seats) {
      return toast(`"${q.label}" कोटा भरिएको छ (${q.seats} सिट)।`, 'err');
    }

    bookingData = {
      seat, type: 'family',
      name,
      headSeat,
      relation,
      quota: head.quota,
      gender: $('#fGender').value,
      age:    $('#fAge').value.trim(),
      note:   $('#fNote').value.trim()
    };
  } else {
    const rank  = $('#fRank').value;
    const idNo  = $('#fId').value.trim();
    const phone = $('#fPhone').value.trim();
    const quota = $('#fQuota').value;

    if (!rank)  return toast('दर्जा छान्नुहोस्।', 'err');
    if (!idNo)  return toast('ID नं. अनिवार्य छ।', 'err');
    if (!phone) return toast('सम्पर्क नं. अनिवार्य छ।', 'err');
    if (!quota) return toast('आरोहण / गन्तव्य स्थान छान्नुहोस्।', 'err');

    const dupId = Object.values(b).find(p => p.idNo && p.idNo.toLowerCase() === idNo.toLowerCase());
    if (dupId) return toast(`ID नं. "${idNo}" पहिले नै सिट ${seatLabel(dupId.seat)} मा दर्ता छ।`, 'err');

    const q = quotaOf(trip.route, quota);
    const used = Object.values(b).filter(p => p.quota === quota).length;
    if (used >= q.seats) {
      return toast(`"${q.label}" कोटा भरिएको छ (${q.seats} सिट)।`, 'err');
    }

    bookingData = {
      seat, type,
      name, rank, idNo,
      unit:  $('#fUnit').value.trim(),
      phone,
      quota,
      gender: $('#fGender').value,
      age:    $('#fAge').value.trim(),
      note:   $('#fNote').value.trim()
    };
  }

  // Disable button while saving
  const submitBtn = $('#bookingForm button[type="submit"]');
  if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = '⏳ सेभ गर्दै...'; }

  const ok = await insertBooking(trip.id, bookingData);
  if (!ok) {
    if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = '✔ आरक्षण पुष्टि गर्ने'; }
    return;
  }

  toast(`सिट ${seatLabel(seat)} — ${name} आरक्षित भयो।`, 'ok');
  state.selectedSeat = null;
  state.newBookingType = 'apf';

  await fetchAllBookings();
  render();
}

/* =====================================================================
   10. MANIFEST
   ===================================================================== */

function viewManifest() {
  const trip = getTrip(state.manifestTrip);
  const b = tripBookings(trip.id);
  const list = Object.values(b).sort((a, c) => a.seat - c.seat);

  const q = state.search.trim().toLowerCase();
  const filtered = q
    ? list.filter(p => {
        const head = p.type === 'family' ? b[p.headSeat] : null;
        const qq = quotaOf(trip.route, p.quota);
        return [p.name, p.rank, p.idNo, p.unit, p.phone, p.relation,
                head?.name, head?.idNo, qq?.label]
          .join(' ').toLowerCase().includes(q);
      })
    : list;

  const tripOptions = ['dashain','tihar'].map(f => {
    const opts = TRIPS.filter(t => t.festival === f)
      .map(t => `<option value="${t.id}" ${t.id === trip.id ? 'selected' : ''}>${tripLabel(t)}</option>`)
      .join('');
    return `<optgroup label="${FESTIVALS[f].name}">${opts}</optgroup>`;
  }).join('');

  const modeHeader = trip.route.mode === 'pickup'
    ? 'आरोहण स्थान (चढ्ने)'
    : 'गन्तव्य (झर्ने)';

  const rows = filtered.length ? filtered.map(p => {
    const qq = quotaOf(trip.route, p.quota);
    const pt = PASSENGER_TYPES[p.type];
    const head = p.type === 'family' ? b[p.headSeat] : null;

    const rankCell = p.type === 'family'
      ? `<b>${esc(p.relation || '—')}</b>
         <div class="hint" style="margin:0">प्रमुख: ${esc(head ? head.name : '—')} · सिट ${seatLabel(p.headSeat)}</div>`
      : esc(p.rank || '—');

    const idCell = p.type === 'family'
      ? (head && head.idNo ? `<span class="id-tag">${esc(head.idNo)}</span>` : '—')
      : (p.idNo ? `<span class="id-tag">${esc(p.idNo)}</span>` : '—');

    const unitCell = p.type === 'family'
      ? (head ? esc(head.unit || '—') : '—')
      : esc(p.unit || '—');

    const phoneCell = p.type === 'family'
      ? (head ? esc(head.phone || '—') : '—')
      : esc(p.phone || '—');

    return `<tr>
      <td class="num"><b>${seatLabel(p.seat)}</b></td>
      <td><b>${esc(p.name)}</b></td>
      <td><span class="badge ${pt.cls}">${pt.short}</span></td>
      <td>${rankCell}</td>
      <td>${idCell}</td>
      <td>${unitCell}</td>
      <td>${phoneCell}</td>
      <td><span class="badge route-badge">${esc(qq ? qq.label : '—')}</span></td>
      <td>${esc(p.gender || '—')} / ${esc(p.age || '—')}</td>
      <td><button class="btn sm danger" data-del="${p.seat}">हटाउने</button></td>
    </tr>`;
  }).join('') : `<tr><td colspan="10"><div class="empty"><div class="big">📋</div>कुनै आरक्षण भेटिएन।</div></td></tr>`;

  let apfC = 0, exC = 0, famC = 0;
  list.forEach(p => {
    if (p.type === 'apf') apfC++;
    else if (p.type === 'ex') exC++;
    else famC++;
  });

  return `
    <div class="panel">
      <div class="panel-head">
        <h2>यात्री सूची (Manifest) <small>${esc(trip.route.from)} → ${esc(trip.route.to)} · ${trip.date} · ${fmtTime(trip.time)}</small></h2>
        <div class="toolbar">
          <select class="trip-select" id="manifestSelect">${tripOptions}</select>
          <input type="search" id="manifestSearch" placeholder="🔍 नाम / ID / स्थान / फोन" value="${esc(state.search)}">
          <button class="btn" id="printBtn">🖨 प्रिन्ट</button>
          <button class="btn" id="csvBtn">⬇ CSV</button>
        </div>
      </div>
      <div class="panel-body" style="padding:0">
        <div class="tbl-wrap">
          <table>
            <thead><tr>
              <th class="num">सिट</th><th>नाम थर</th><th>प्रकार</th>
              <th>दर्जा / सम्बन्ध</th><th>ID नं.</th><th>कार्यालय/प्रमुख</th>
              <th>सम्पर्क</th>
              <th>${esc(modeHeader)}</th>
              <th>लिङ्ग/उमेर</th><th></th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
      <div class="panel-head" style="border-top:1px solid var(--line);border-bottom:none">
        <span class="hint">
          जम्मा: <b>${list.length}</b> / ${TOTAL_SEATS} ·
          सप्र <b>${apfC}</b> · भूतपूर्व <b>${exC}</b> · परिवार <b>${famC}</b> ·
          खाली <b>${TOTAL_SEATS - list.length}</b>
        </span>
      </div>
    </div>`;
}

function bindManifest() {
  const sel = $('#manifestSelect');
  if (sel) sel.addEventListener('change', e => {
    state.manifestTrip = e.target.value;
    state.search = '';
    render();
  });

  const search = $('#manifestSearch');
  if (search) {
    search.addEventListener('input', e => {
      state.search = e.target.value;
      const pos = e.target.selectionStart;
      render();
      const s2 = $('#manifestSearch');
      if (s2) { s2.focus(); s2.setSelectionRange(pos, pos); }
    });
  }

  $$('[data-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const seat = Number(btn.dataset.del);
      const trip = getTrip(state.manifestTrip);
      const b = tripBookings(trip.id);
      const p = b[seat];
      if (!p) return;

      const family = p.type !== 'family' ? familyMembersOf(trip, seat) : [];

      let msg = `सिट ${seatLabel(seat)} (${p.name}) को आरक्षण हटाउने?`;
      if (family.length) {
        msg += `\n\n⚠️ यससँग जोडिएका ${family.length} जना परिवारको सदस्य पनि हट्नेछन्।`;
      }
      if (!confirm(msg)) return;

      const seatsToDelete = [seat, ...family.map(f => f.seat)];
      const ok = await deleteBookings(trip.id, seatsToDelete);
      if (!ok) return;

      toast('आरक्षण हटाइयो।', 'ok');
      await fetchAllBookings();
      render();
    });
  });

  const p = $('#printBtn'); if (p) p.addEventListener('click', printManifest);
  const c = $('#csvBtn');   if (c) c.addEventListener('click', exportCSV);
}

function printManifest() {
  const trip = getTrip(state.manifestTrip);
  const b = tripBookings(trip.id);
  const list = Object.values(b).sort((a, c) => a.seat - c.seat);
  const modeHeader = trip.route.mode === 'pickup' ? 'आरोहण (चढ्ने)' : 'गन्तव्य (झर्ने)';

  const rows = list.map((p, i) => {
    const q = quotaOf(trip.route, p.quota);
    const pt = PASSENGER_TYPES[p.type];
    const head = p.type === 'family' ? b[p.headSeat] : null;

    const rankCell = p.type === 'family'
      ? `${p.relation || ''} / ${head ? head.name : ''}`
      : (p.rank || '');
    const idCell = p.type === 'family'
      ? (head ? (head.idNo || '') : '')
      : (p.idNo || '');

    return `<tr>
      <td>${i + 1}</td>
      <td>${seatLabel(p.seat)}</td>
      <td>${esc(p.name)}</td>
      <td>${esc(pt.short)}</td>
      <td>${esc(rankCell)}</td>
      <td>${esc(idCell)}</td>
      <td>${esc((head ? head.unit : p.unit) || '')}</td>
      <td>${esc((head ? head.phone : p.phone) || '')}</td>
      <td>${esc(q ? q.label : '')}</td>
      <td></td>
    </tr>`;
  }).join('');

  $('#printRoot').innerHTML = `
    <h1>सशस्त्र प्रहरी बल, नेपाल</h1>
    <h2>बस यात्री सूची (Manifest) — ${FESTIVALS[trip.festival].name}</h2>
    <div class="meta">
      <b>मिति:</b> ${trip.date} (वि.सं.) &nbsp;&nbsp;
      <b>रुट:</b> ${esc(trip.route.from)} → ${esc(trip.route.to)} &nbsp;&nbsp;
      <b>छुट्ने स्थान:</b> ${esc(trip.place)} &nbsp;&nbsp;
      <b>समय:</b> ${fmtTime(trip.time)}
    </div>
    <table>
      <thead><tr>
        <th>क्र.</th><th>सिट</th><th>नाम</th><th>प्रकार</th>
        <th>दर्जा / सम्बन्ध</th><th>ID नं.</th><th>कार्यालय</th>
        <th>सम्पर्क</th><th>${esc(modeHeader)}</th>
        <th>दस्तखत</th>
      </tr></thead>
      <tbody>${rows || '<tr><td colspan="10" style="text-align:center">कुनै आरक्षण छैन</td></tr>'}</tbody>
    </table>
    <div class="meta" style="margin-top:10px">
      <b>जम्मा यात्री:</b> ${list.length} &nbsp;
      <b>खाली सिट:</b> ${TOTAL_SEATS - list.length} &nbsp;
      <b>कुल सिट:</b> ${TOTAL_SEATS}
    </div>
    <div class="sign">
      <div>.................................<br>बस सञ्चालक</div>
      <div>.................................<br>समन्वय अधिकृत</div>
    </div>`;

  window.print();
}

function exportCSV() {
  const trip = getTrip(state.manifestTrip);
  const b = tripBookings(trip.id);
  const list = Object.values(b).sort((a, c) => a.seat - c.seat);
  if (!list.length) return toast('निर्यात गर्न कुनै डाटा छैन।', 'err');

  const modeHeader = trip.route.mode === 'pickup' ? 'आरोहण स्थान' : 'गन्तव्य';
  const head = ['सिट','नाम थर','प्रकार','दर्जा','ID नं.','सम्बन्ध',
                'प्रमुख (सिट/नाम)','प्रमुख ID','कार्यालय/युनिट','सम्पर्क',
                modeHeader,'लिङ्ग','उमेर','कैफियत'];
  const rows = list.map(p => {
    const q = quotaOf(trip.route, p.quota);
    const pt = PASSENGER_TYPES[p.type];
    const hd = p.type === 'family' ? b[p.headSeat] : null;
    return [
      seatLabel(p.seat),
      p.name,
      pt.label,
      p.type === 'family' ? '' : (p.rank || ''),
      p.type === 'family' ? '' : (p.idNo || ''),
      p.type === 'family' ? (p.relation || '') : '',
      hd ? `${seatLabel(hd.seat)} / ${hd.name}` : '',
      hd ? (hd.idNo || '') : '',
      hd ? (hd.unit || '') : (p.unit || ''),
      hd ? (hd.phone || '') : (p.phone || ''),
      q ? q.label : '',
      p.gender || '',
      p.age || '',
      p.note || ''
    ];
  });

  const csv = '\uFEFF' + [head, ...rows]
    .map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(','))
    .join('\r\n');

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `manifest_${trip.date.replace(/\//g, '-')}_${trip.routeId}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('CSV डाउनलोड भयो।', 'ok');
}

/* =====================================================================
   11. QUOTA
   ===================================================================== */

function viewQuota() {
  const blocks = ['KTM-KAK','KTM-GAD','KAK-KTM','GAD-KTM'].map(rid => {
    const r = ROUTES[rid];
    const total = r.quotas.reduce((s, q) => s + q.seats, 0);

    const trips = TRIPS.filter(t => t.routeId === rid);
    const usage = {};
    r.quotas.forEach(q => usage[q.key] = 0);
    trips.forEach(t => Object.values(tripBookings(t.id))
      .forEach(p => { if (usage[p.quota] !== undefined) usage[p.quota]++; }));

    const capacity = r.quotas.reduce((acc, q) => { acc[q.key] = q.seats * trips.length; return acc; }, {});

    const rows = r.quotas.map(q => {
      const used = usage[q.key];
      const cap = capacity[q.key];
      const pct = cap ? Math.round(used / cap * 100) : 0;
      return `<tr>
        <td><b>${esc(q.label)}</b></td>
        <td><b>${q.seats}</b></td>
        <td>${trips.length}</td>
        <td>${cap}</td>
        <td>${used}</td>
        <td style="min-width:160px">
          <div class="bar"><i class="${pct >= 100 ? 'full' : ''}" style="width:${pct}%"></i></div>
        </td>
        <td>${pct}%</td>
      </tr>`;
    }).join('');

    return `
      <div class="panel">
        <div class="panel-head">
          <h2>${esc(r.from)} → ${esc(r.to)}
            <small>प्रति बस ${total} सिट · कुल ${trips.length} यात्रा</small></h2>
          <span class="badge">${r.mode === 'pickup' ? 'चढ्ने स्थान (आरोहण)' : 'झर्ने स्थान (गन्तव्य)'}</span>
        </div>
        <div class="tbl-wrap">
          <table>
            <thead><tr>
              <th>${r.mode === 'pickup' ? 'आरोहण स्थान' : 'गन्तव्य स्थान'}</th>
              <th>सिट/बस</th><th>यात्रा</th>
              <th>कुल क्षमता</th><th>आरक्षित</th><th>प्रगति</th><th>%</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
  }).join('');

  return `<div class="note">
    📊 <b>चढ्ने/झर्ने स्थान अनुसार कोटा</b> — प्रत्येक यात्रुको आरोहण/गन्तव्य स्थानको आधारमा।
    परिवारको सदस्यले प्रमुख कर्मचारीकै स्थान प्रयोग गर्छन्। प्रत्येक बसमा जम्मा <b>${TOTAL_SEATS} सिट</b>।
  </div>${blocks}`;
}

/* =====================================================================
   12. COORDINATION
   ===================================================================== */

    <tr>
      <td class="num">${i + 1}</td>

      <td>${esc(o.unit)}</td>

  const unitRows = COORD_UNITS.map((u, i) => `
    <tr>
      <td class="num">${i + 1}</td>
      <td>${esc(u)}</td>
      <td>—</td><td>—</td><td>—</td>
    </tr>`).join('');

  return `
    <div class="panel">
      <div class="panel-head">
        <h2>समन्वय अधिकृत — सशस्त्र प्रहरी बल, नेपाल प्रधान कार्यालय
          <small>काठमाडौँ — केन्द्रीय समन्वय टोली</small></h2>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th class="num">सि.नं</th><th>दर्जा</th><th>नाम थर</th><th>कार्यालय</th><th>सम्पर्क नं.</th></tr></thead>
          <tbody>${hqRows}</tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>काठमाडौँ देखी काँकडभिट्टा रुट
          <small>निम्न युनिटहरूले १/१ जना समन्वय अधिकृत खटाउनु पर्ने</small></h2>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead><tr>
            <th class="num">सि.नं</th><th>कार्यालयको नाम</th>
            <th>दर्जा</th><th>नाम थर</th><th>सम्पर्क नं.</th>
          </tr></thead>
          <tbody>${unitRows}</tbody>
        </table>
      </div>
    </div>`;
}

/* =====================================================================
   13. INIT
   ===================================================================== */

$$('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    state.tab = btn.dataset.tab;
    if (state.tab === 'manifest') state.manifestTrip = state.activeTrip;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});

async function init() {
  const overlay = $('#loadingOverlay');
  const ok = await fetchAllBookings();
  overlay.classList.add('hidden');

  if (!ok) {
    alert('Supabase बाट डाटा लोड गर्न सकिएन।\n\n' +
          'कृपया जाँच्नुहोस्:\n' +
          '1. SUPABASE_URL र SUPABASE_ANON_KEY ठीक छ?\n' +
          '2. इन्टरनेट चलिरहेको छ?\n' +
          '3. Supabase मा "bookings" टेबल बनाइएको छ?');
    return;
  }

  render();
  setupRealtime();
}

init();
